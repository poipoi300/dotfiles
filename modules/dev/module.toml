description = "Development: Zed, Docker, Go, uv, Node, Rust toolchain manager"
category    = "dev"
groups      = ["docker"]

[packages]
pacman = ["zed", "docker", "docker-buildx", "docker-compose", "go", "uv", "nodejs", "npm",
          "pnpm", "bun", "rustup", "clang", "llvm", "lld", "lldb", "cmake", "rust-analyzer",
          "pyright", "vulkan-tools", "vulkan-headers", "vulkan-validation-layers", "shaderc",
          "sway", "grim", "cage",   # sway/cage: isolated (headless) compositors for GUI tests
          "cargo-nextest", "cargo-llvm-cov", "cargo-deny",   # Rust test/coverage/licence gates
          "sccache",   # shared Rust compile cache; wired up in home/.cargo/config.toml
          "mold",   # fast linker for native Linux Rust builds; see home/.cargo/config.toml
          "act", "actionlint",   # run and lint GitHub Actions workflows locally
          "dotnet-sdk"]
# claude-code: native self-updating install (~/.local/bin/claude), see README.
aur    = ["opencode-bin", "openai-codex-bin"]

[units]
system = ["docker.service", "containerd.service"]
