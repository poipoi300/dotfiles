# Colours come from the DMS theme: matugen writes them to ~/.cache/fuzzel-colors.ini
# (template in ~/.config/matugen/templates/fuzzel-colors.ini).
[main]
include=~/.cache/fuzzel-colors.ini
font=Inter:size=13
icon-theme=breeze-dark
terminal=alacritty -e
layer=overlay
prompt="❯  "
width=40
lines=12
horizontal-pad=24
vertical-pad=16
inner-pad=8
image-size-ratio=0.5
fields=filename,name,generic,keywords
match-mode=fzf
show-actions=yes

[border]
width=2
radius=16

[dmenu]
exit-immediately-if-empty=yes
