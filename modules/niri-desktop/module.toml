description = "niri session with DankMaterialShell, fuzzel launcher, alacritty, portals and NetworkManager"
category    = "desktop"
requires    = ["audio"]

[packages]
pacman = ["niri", "xwayland-satellite", "xdg-desktop-portal-gnome", "xdg-desktop-portal-gtk",
          "polkit-gnome", "qt5-wayland", "qt6-wayland", "cliphist", "fuzzel", "matugen", "cava",
          "networkmanager", "network-manager-applet", "alacritty", "ttf-firacode-nerd",
          "quickshell", "xdg-utils"]
aur    = ["dms-shell-bin"]

[units]
system = ["NetworkManager.service", "NetworkManager-dispatcher.service"]
user   = ["dms.service"]
