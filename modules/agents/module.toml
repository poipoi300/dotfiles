description = "Shared AI-agent tooling: ~/.agents (skills, roles, hooks, MCP sync) for Claude Code and Codex, RTK, Impeccable engine"
category    = "ai"

# Claude and Codex read the one shared instruction file through links; their settings stay local.
links = { ".claude/CLAUDE.md" = ".agents/AGENTS.md", ".claude/RTK.md" = ".agents/RTK.md", ".codex/AGENTS.md" = ".agents/AGENTS.md" }

[packages]
# python: sync.py, hooks and tests (3.11+); python-yaml: the test suite only.
# nodejs/npm: `npx -y <pkg>` MCP servers; uv: `uvx` MCP servers.
pacman = ["python", "python-yaml", "nodejs", "npm", "uv"]
# openai-codex-bin comes from the dev module; Claude Code is its native install (dev README).
aur    = []
# rtk: github.com/rtk-ai/rtk release binary; impeccable-engine: the Impeccable skill's engine.
local  = ["rtk", "impeccable-engine"]
