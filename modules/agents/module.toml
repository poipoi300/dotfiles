description = "Shared AI-agent tooling: ~/.agents (skills, roles, hooks, MCP sync) for Claude Code, Codex, Antigravity and Grok, RTK, Impeccable engine"
category    = "ai"

# Every provider reads the one shared instruction file through a link in its global rules path
# (Antigravity: ~/.gemini/config/AGENTS.md; Grok: any *.md in ~/.grok/rules; OpenCode: ~/.config/opencode/AGENTS.md); settings stay local.
links = { ".claude/CLAUDE.md" = ".agents/AGENTS.md", ".claude/RTK.md" = ".agents/RTK.md", ".codex/AGENTS.md" = ".agents/AGENTS.md", ".gemini/config/AGENTS.md" = ".agents/AGENTS.md", ".grok/rules/AGENTS.md" = ".agents/AGENTS.md", ".config/opencode/AGENTS.md" = ".agents/AGENTS.md" }

[packages]
# python: sync.py, hooks and tests (3.11+); python-yaml: the test suite only; python-tomlkit:
# sync.py's edits to Grok's config.toml, which Grok itself rewrites.
# nodejs/npm: `npx -y <pkg>` MCP servers; uv: `uvx` MCP servers.
pacman = ["python", "python-yaml", "python-tomlkit", "nodejs", "npm", "uv"]
# openai-codex-bin comes from the dev module; Claude Code is its native install (dev README);
# agy (antigravity-cli) and grok (grok-build) come from the ai module.
aur    = []
# rtk: github.com/rtk-ai/rtk release binary; impeccable-engine: the Impeccable skill's engine.
local  = ["rtk", "impeccable-engine"]
