description = "Desktop applications"
category    = "apps"
dirs        = ["Applications"]   # removed on off once empty

[packages]
local  = ["pear-desktop-poipoi", "haruneko", "svp", "python-mozjpeg-lossless-optimization", "kcc"]   # pear: own fork
pacman = ["discord", "obsidian", "krita", "krita-plugin-gmic", "partitionmanager",
          "ark", "mpv", "bitwarden", "qbittorrent", "okular", "libreoffice-fresh", "blender",
          "obs-studio", "audacity", "handbrake", "ffmpeg", "vapoursynth", "satty", "grim",
          "slurp", "displaycal", "argyllcms"]
aur    = ["strata-bin",   # the file manager (Dolphin and COSMIC Files tried and dropped)
          "obs-vkcapture", "qdirstat", "postybirb-bin", "filmcraft",
          "solidcraft"]

# T3 Code updates itself in place; the pin is what a fresh machine starts from.
[appimages.t3code]
url         = "https://github.com/pingdotgg/t3code/releases/download/v0.1.11/T3-Code-x86_64.AppImage"
sha256      = "8baa06a7bbaa3f729d69466fb211ed7006d6a6e4d800b9ecdacd831fd1686b14"
path        = "Applications/T3-Code.AppImage"
self_update = true

# Nightly channel beside the stable build; it shares ~/.t3 and the Electron
# profile, so only one of the two runs at a time.
[appimages.t3code-nightly]
url         = "https://github.com/pingdotgg/t3code/releases/download/v0.1.12-nightly.20261121.5024/T3-Code-Nightly-x86_64.AppImage"
sha256      = "523394fa3b93f0e8376785208aef845f83bbb5df089086259fe08fcfc1bb717e"
path        = "Applications/T3-Code-Nightly.AppImage"
self_update = true
